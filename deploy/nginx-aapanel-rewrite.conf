# ============================================================
# Tourfecto - قواعد Nginx (URL rewrite) للاستضافة الجديدة (aaPanel)
#
# Nginx مابيقراش ملفات .htaccess خالص، فمن غير القواعد دي كل صفحة
# غير الرئيسية (/login, /dashboard, /api/...) بتطلع 404.
#
# الاستخدام في aaPanel:
#   Website -> الموقع -> Conf -> URL rewrite  ← الصق الجزء ده هناك واحفظ
# ============================================================

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# منع الوصول لأي ملفات حساسة لو اتحطت جوه public_html بالغلط
location ~* \.(env|log|sql|md|ini|sh|bak|neon|lock)$ {
    deny all;
}
location ~ /\.(?!well-known) {
    deny all;
}
